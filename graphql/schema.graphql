"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    currentUser: User @auth
    products: [Product!] @paginate
    productSlugs: [String!]
    getProductBySlug(
        slug: String!
    ): Product
    getCart: Cart!
    cartItem(id: ID! @whereKey): CartItem @find
    shippingMethods: [ShippingMethod!] @all
}

type Mutation {
    #Cart
    toggleApplyBalance: Cart!
    applyCoupon(
        code: String!
    ): Cart!
    removeCoupon(
        code: String! @rules(apply: ["exists:coupons,code"])
    ): Cart!
    setCartEmail(email: String! @rules(apply: ["email"])): Cart!
    createShippingAddress(
        address1: String,
        address2: String,
        city: String,
        country: String,
        first_name: String,
        last_name: String,
        phone_number: String,
        postal_code: String,
        state: String
    ): Cart!
    updateShippingAddress(
        customerAddressId: String! @rules(apply: ["exists:customer_addresses,id"]),
        address1: String,
        address2: String,
        city: String,
        country: String,
        first_name: String,
        last_name: String,
        phone_number: String,
        postal_code: String,
        state: String
    ): Cart!
    setShippingAddress(customerAddressId: String! @rules(apply: ["exists:customer_addresses,id"])): Cart!
    setShippingMethod(shippingMethodId: String! @rules(apply: ["exists:shipping_methods,id"])): Cart!

    # Cart Item
    addCartItem(
        productId: String! @rules(apply: ["exists:products,id"]),
        quantity: Int! @rules(apply: ["min:0"])
        personalize: PersonalizeInput!
    ): Cart!
    updateCartItem(
        cartItemId: String! @rules(apply: ["exists:cart_items,id"]),
        personalize: PersonalizeInput!
    ): Cart!
    updateCartItemQuantity(
        cartItemId: String! @rules(apply: ["exists:cart_items,id"]),
        quantity: Int! @rules(apply: ["min:0"])
    ): Cart!
    removeCartItem(cartItemId: String!): Cart!

    # Order
    placeOrder: Order!

    # Customer
    registerCustomer(
        email: String! @rules(apply: ["email", "unique:users,email"])
        password: String! @rules(apply: ["min:8", "confirmed"])
        password_confirmation: String!
        name: String! @rules(apply: ["max:255"])
    ): User
    loginCustomer(email: String!, password: String!): User!
}

input PersonalizeInput {
    colorId: ID!
    designId: ID!
    fontId: ID!
    sizeId: ID!
    options: [OptionInput]!
    textLines: [TextLineInput]!
}

input OptionInput {
    optionId: ID!
    optionValueId: ID!
}

input TextLineInput {
    productLineDefinitionId: ID!
    value: String!
}

enum UserRole {
    ADMIN
    MANAGER
    CUSTOMER
}

type User {
    id: ID!
    role: UserRole!
    name: String!
    email: String!
    email_verified_at: DateTime
    created_at: DateTime!
    updated_at: DateTime!
}

type Cart {
    id: ID!
    key: String! @field(resolver: "App\\GraphQL\\Resolvers\\UniqueKey")
    items: [CartItem!]
    shipping_method: ShippingMethod
    shipping_address: CustomerAddress
    coupons: [Coupon!]
    totals: Totals! @field(resolver: "App\\GraphQL\\Resolvers\\TotalsResolver")
    apply_balance: Boolean!
    can_place_order: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\CanPlaceOrder")
    can_apply_coupon: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\CanApplyCoupon")
    can_apply_balance: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\CanApplyBalance")
    email: String
    can_login: Boolean @field(resolver: "App\\GraphQL\\Resolvers\\CartCanLogin")
    customer_addresses: [CustomerAddress!] @field(resolver: "App\\GraphQL\\Resolvers\\InjectCustomerAddressesInCart")
}

type Order {
    id: ID!
    items: [OrderItem!]
    shipping_method: ShippingMethod
    shipping_address: CustomerAddress
    coupons: [Coupon!]
    totals: Totals! @field(resolver: "App\\GraphQL\\Resolvers\\TotalsResolver")
    apply_balance: Boolean!
}

type CustomerAddress {
    id: ID!
    address1: String
    address2: String
    city: String
    country: String
    first_name: String
    last_name: String
    phone_number: String
    postal_code: String
    state: String
}

type Totals {
    subtotal: Int!
    grand_total: Price!
    points_used: Int!
}

type Coupon {
    id: ID!
    code: String!
    discount_percentage: Int!
}

type ShippingMethod {
    id: ID!
    label: String!
    description: String
    info: ShippingInfo! @field(resolver: "App\\GraphQL\\Resolvers\\ShippingInfoResolver")
}

type ShippingInfo {
    price: Float!
    days: Int!
}

type CartItem {
    id: ID!
    product_id: Int!
    design_id: Int
    color_id: Int
    font_id: Int
    quantity: Int!
    product: Product!
    option_items: [ProductOptionItem!]
    product_size: ProductSize
    design: Design
    color: Color
    font: Font
    text_lines: [CartItemTextLine!]
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
}

type OrderItem {
    id: ID!
    product_id: Int!
    design_id: Int
    color_id: Int
    font_id: Int
    quantity: Int!
    product: Product!
    option_items: [ProductOptionItem!]
    product_size: ProductSize
    design: Design
    color: Color
    font: Font
    text_lines: [OrderItemTextLine!]
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
}

type CartItemTextLine {
    id: ID!
    value: String!
    product_line_definition: ProductLineDefinition!
}

type OrderItemTextLine {
    id: ID!
    value: String!
    product_line_definition: ProductLineDefinition!
}

type Product {
    id: ID!
    key: String! @field(resolver: "App\\GraphQL\\Resolvers\\UniqueKey")
    slug: String!
    sku: String!
    name: String!
    meta_title: String!
    meta_description: String!
    description: String!
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
    line_definitions: [ProductLineDefinition!]
    designs: [Design!]!
    options: [ProductOption!]!
    sizes: [ProductSize!]!
    gallery: [ProductGalleryItem!]!
    reverse_side_base: Base
    primary_image: ProductGalleryItem
}

type ProductGalleryItem {
    id: ID!
    label: String!
    is_video: Boolean!
    filename: String!
}

type ProductLineDefinition {
    id: String!
    label: String!
    max_length: Int!
    required: Boolean!
    hidden: Boolean!
    default_value: String
    sort: Int!
}

type ProductSize {
    id: ID!
    product_id: ID!
    label: String!
    width: Int!
    height: Int!
    thickness: Int!
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
}

type ProductOption {
    id: ID!
    label: String!
    items: [ProductOptionItem!]!
    required: Boolean!
}

type ProductOptionItem {
    id: ID!
    label: String!
    product_option: ProductOption!
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
}

type Price {
    regular: Int!
    is_discounted: Boolean!
    discounted: Float!
}

type Design {
    id: ID!
    label: String!
    colors: [Color!]
    fonts: [Font!]
    bases: [Base!]!
    preview: String!
}

type Base {
    id: ID!
    label: String!
    filename: String!
    text_areas: [BaseTextArea!]
    content: String! @field(resolver: "App\\GraphQL\\Resolvers\\BaseContent")
}

type BaseTextArea {
    id: ID!
    width: Float!
    height: Float!
    left: Float!
    top: Float!
    first_line: Int!
    lines: Int!
    text_color: String
    inherit_color: Boolean!
}

type Font {
    id: ID!
    label: String!
    name: String!
    filename_woff2: String!
    filename_ttf: String
    filename_otf: String
    preview: String!
}

type Color {
    id: ID!
    label: String!
    hex: String!
}
