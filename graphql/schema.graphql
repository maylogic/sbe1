"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
        "Search by primary key."
        id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

        "Search by email address."
        email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    products: [Product!] @paginate
    productSlugs: [String!]
    getProductBySlug(
        slug: String!
    ): Product
    getCart: Cart!

    "List multiple users."
    users(
        "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
        name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)
}

type Mutation {
    toggleApplyBalance: Cart!
    applyCoupon(
        code: String! @rules(apply: ["exists:coupons,code"])
    ): Cart!
    addCartItem(
        productId: Int! @rules(apply: ["exists:products,id"]),
        quantity: Int! @rules(apply: ["min:0"])
    ): Cart!
    registerCustomer(
        email: String! @rules(apply: ["email", "unique:users,email"])
        password: String! @rules(apply: ["min:8", "confirmed"])
        password_confirmation: String!
        name: String! @rules(apply: ["max:255"])
    ): User
    loginCustomer(email: String!, password: String!): User!
}

enum UserRole {
    ADMIN
    MANAGER
    CUSTOMER
}

"Account of a person who utilizes this application."
type User {
    "Unique primary key."
    id: ID!

    role: UserRole!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}

type Cart {
    id: ID!
    items: [CartItem!]
    shipping_method: ShippingMethod @field(resolver: "App\\GraphQL\\Resolvers\\EstimateDeliveryTimeAndPrice")
    shipping_address: CustomerAddress
    billing_address: CustomerAddress
    coupons: [Coupon!]
    totals: Totals! @field(resolver: "App\\GraphQL\\Resolvers\\TotalsResolver")
    apply_balance: Boolean!
    can_apply_balance: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\CanApplyBalance")
}

enum CustomerAddressType {
    BILLING
    SHIPPING
    UNIVERSAL
}

type CustomerAddress {
    address1: String
    address2: String
    city: String
    country: String
    first_name: String
    last_name: String
    phone_number: String
    postal_code: String
    state: String
    type: CustomerAddressType!
}
type Totals {
    subtotal: Int!
    grand_total: Price!
}

type Coupon {
    id: ID!
    code: String!
    discount_percentage: Int!
}

type ShippingMethod {
    description: String
    estimated_delivery: String
    id: ID!
    name: String!
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
}

type CartItem {
    id: ID!
    product_id: Int!
    design_id: Int
    color_id: Int
    font_id: Int
    quantity: Int!
    product: Product!
    option_items: [ProductOptionItem!]
    product_size: ProductSize
    design: Design
    color: Color
    font: Font
    text_lines: [CartItemTextLine!]
}

type CartItemTextLine {
    id: ID!
    value: String!
    definition: ProductLineDefinition!
}

type Product {
    id: ID!
    slug: String!
    sku: String!
    name: String!
    meta_title: String!
    meta_description: String!
    description: String!
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
    line_definitions: [ProductLineDefinition!]
    designs: [Design!]
    options: [ProductOption!]
    sizes: [ProductSize!]
    gallery: [ProductGalleryItem!]
    reverse_side_base: Base
    primary_image: ProductGalleryItem
}

type ProductGalleryItem {
    id: ID!
    label: String!
    is_video: Boolean!
    filename: String!
}

type ProductLineDefinition {
    label: String!
    max_length: Int!
    required: Boolean!
}

type ProductSize {
    id: ID!
    product_id: ID!
    label: String!
    width: Int!
    height: Int!
    thickness: Int!
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
}

type ProductOption {
    id: ID!
    label: String!
    items: [ProductOptionItem!]!
}

type ProductOptionItem {
    id: ID!
    label: String!
    price: Price! @field(resolver: "App\\GraphQL\\Resolvers\\PriceResolver")
}

type Price {
    regular: Int!
    is_discounted: Boolean!
    discounted: Int!
}

type Design {
    id: ID!
    label: String!
    colors: [Color!]
    fonts: [Font!]
    bases: [Base!]!
}

type Base {
    id: ID!
    label: String!
    filename: String!
    text_areas: [BaseTextArea!]
}

type BaseTextArea {
    id: ID!
    width: Float!
    height: Float!
    left: Float!
    top: Float!
    first_line: Int!
    lines: Int!
    text_color: String
    inherit_color: Boolean!
}

type Font {
    id: ID!
    label: String!
    name: String!
    filename_woff2: String!
    filename_ttf: String
    filename_otf: String
}

type Color {
    id: ID!
    label: String!
    hex: String!
}
